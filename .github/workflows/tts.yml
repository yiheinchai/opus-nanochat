# Generates the lecture narration with ElevenLabs, using the repository secret ELEVENLABS_API_KEY,
# and uploads the clips as a workflow artifact (so no audio gets committed to the repo).
name: tts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list (models, voices, quota) or generate"
        default: "list"
      model:
        description: "ElevenLabs model id"
        default: "eleven_v3"
      voices:
        description: "voice id(s), comma separated"
        default: ""
      indices:
        description: "manifest indices (comma separated) or 'all'"
        default: "0,70,75,93"

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List models, voices and quota
        if: inputs.mode == 'list'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python lecture/tts/elevenlabs_job.py list
      - name: Generate
        if: inputs.mode == 'generate'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python lecture/tts/elevenlabs_job.py generate --model "${{ inputs.model }}" --voice "${{ inputs.voices }}" --indices "${{ inputs.indices }}" --out narration
      - name: Upload the clips (also after a partial failure, so nothing is lost)
        if: always() && inputs.mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: narration
          path: narration
          if-no-files-found: warn
