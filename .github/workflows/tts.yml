# Generates the lecture narration with a hosted TTS (Gemini or ElevenLabs), using the repository secret
# GEMINI_API_KEY or ELEVENLABS_API_KEY, and uploads the clips as a workflow artifact (no audio gets committed).
name: tts

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "gemini or elevenlabs"
        default: "gemini"
      mode:
        description: "list (models, voices) or generate"
        default: "list"
      model:
        description: "model id (empty: the backend's default)"
        default: ""
      voices:
        description: "voice id(s) or name(s), comma separated (empty: the backend's default)"
        default: ""
      indices:
        description: "manifest indices (comma separated) or 'all'"
        default: "0,93"
      parts:
        description: "gemini: script parts to read in one request each (comma separated names, or 'all'), instead of clips"
        default: ""

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        if: inputs.mode == 'generate'
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: List
        if: inputs.mode == 'list'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python lecture/tts/${{ inputs.backend == 'elevenlabs' && 'elevenlabs_job.py' || 'gemini_job.py' }} list
      - name: Generate
        if: inputs.mode == 'generate'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          VOICES: ${{ inputs.voices }}
          INDICES: ${{ inputs.indices }}
          PARTS: ${{ inputs.parts }}
        run: |
          script=lecture/tts/${{ inputs.backend == 'elevenlabs' && 'elevenlabs_job.py' || 'gemini_job.py' }}
          args=(generate --indices "$INDICES" --out narration)
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          if [ -n "$VOICES" ]; then args+=(--voice "$VOICES"); fi
          if [ -n "$PARTS" ]; then args+=(--parts "$PARTS"); fi
          python "$script" "${args[@]}"
      - name: Upload the clips (also after a partial failure, so nothing is lost)
        if: always() && inputs.mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: narration
          path: narration
          if-no-files-found: warn
